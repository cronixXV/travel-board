services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-wanderboard}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-wanderboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./server/src:/app/server/src
      - ./shared:/app/shared
      - ./client/dist:/app/client/dist:ro
      - ./uploads:/app/uploads
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-wanderboard}
      PORT: 3000
      CLIENT_URL: http://localhost:5173
      APP_PUBLIC_URL: http://localhost:3000
      API_PUBLIC_URL: http://localhost:3000
      CLIENT_DIST_PATH: /app/client/dist
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile.dev
    restart: unless-stopped
    volumes:
      - ./client/src:/app/client/src
      - ./shared:/app/shared
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_PUBLIC_APP_URL: http://localhost:3000
    depends_on:
      - server

volumes:
  postgres_data: